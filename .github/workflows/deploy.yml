name: Build & Deploy to Cloudflare Pages

# push 到 main 即自动构建并部署
on:
  push:
    branches: [main]
  workflow_dispatch:      # 也可以在 Actions 页面手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 白名单构建：只把 index.html / assets / _headers 放进 dist，
      # 发现隐藏文件或密钥会直接失败，阻止部署
      - name: Build (whitelist + security audit)
        run: node build.mjs

      # 部署 dist；functions/ 在仓库根，wrangler 会一并打包
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ↓↓↓ 改成你的 Pages 项目名（Cloudflare 控制台里显示的那个）
          command: pages deploy dist --project-name=timdingpersonalblog
